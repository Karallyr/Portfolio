<script>
DC.define("SiteCNA", function (DCLogic) {

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this._step = 0; this._hover = false; this._holdUntil = 0;
    this._acc = 0; this._accHover = false; this._car = 0;
    this._onScroll = function () { self.measure(); };
    window.addEventListener('scroll', this._onScroll, true);
    window.addEventListener('resize', this._onScroll);
    this._clockT = setInterval(function () { self.setState({ clock: self.clockStr() }); }, 1000);
    this._dmT = setInterval(function () {
      if (self._hover || Date.now() < self._holdUntil) { return; }
      self._step = (self._step + 1) % 5;
      self.setState({ step: self._step });
    }, 3400);
    this._accT = setInterval(function () {
      if (self._accHover) { return; }
      self._acc = (self._acc + 1) % 4;
      self.setState({ acc: self._acc });
    }, 3000);
    this._carT = setInterval(function () {
      self._car = (self._car + 1) % 3;
      self.setState({ car: self._car });
    }, 2400);
    this._mT = setTimeout(function () {
      self.measure();
      var se = document.scrollingElement || document.documentElement;
      if (se && se.scrollHeight <= window.innerHeight + 40) { self.startCount(); }
    }, 400);
  }
  componentWillUnmount() {

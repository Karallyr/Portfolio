<div class="tile" style="background: #FFE6F1; padding: 44px 36px 22px"><img src="assets/chill-au-louvre/727f1e85d54e.webp" alt="Logo Chill au Louvre en noir"><span class="tlab" style="color: rgba(17,17,17,0.55)">Version noire</span></div>
</div>
</div>

<span class="bri aa" style="font-weight: 800; color: #FF1F8A">Aa</span>
<span class="bri" style="font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: -0.02em">Du quartier au musée, 1er parcours citoyen immersif</span>
<span class="bri" style="font-weight: 600; font-size: 13px; line-height: 1.5; color: rgba(17,17,17,0.6); word-break: break-all">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</span>
</div>
<div class="tyc" style="background: #111111; color: #FFFFFF">
<span class="mono" style="font-size: 11px; color: rgba(255,255,255,0.6)">Textes</span>

<span class="fig aa" style="font-weight: 500; color: #FF1F8A">Aa</span>

</div>
</div>

<script>
DC.define("SiteLouvre", function (DCLogic) {

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this._onScroll = function () { self.measure(); };
    window.addEventListener('scroll', this._onScroll, true);
    window.addEventListener('resize', this._onScroll);
    this._clockT = setInterval(function () { self.setState({ clock: self.clockStr() }); }, 1000);
    this._mT = setTimeout(function () { self.measure(); }, 400);
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll, true);
    window.removeEventListener('resize', this._onScroll);
    clearInterval(this._clockT); clearTimeout(this._mT);
  }
  clockStr() {
    try {
      return new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
    } catch (e) { return ''; }
  }
  measure() {
    var el = document.getElementById('lv-split');
    if (!el) { return; }
    var vh = window.innerHeight || 1;
    var r = el.getBoundingClientRect();
    var total = Math.max(1, r.height - vh);
    var p = Math.min(1, Math.max(0, -r.top / total));
    var act = 0;
    var blks = document.querySelectorAll('[data-sec]');
    for (var i = 0; i < blks.length; i++) {
      if (blks[i].getBoundingClientRect().top < vh * 0.5) { act = parseInt(blks[i].getAttribute('data-sec'), 10) || 0; }
    }
    var pct = Math.round(p * 100);
    var hw = document.getElementById('lv-s1');
    var hpEl = document.getElementById('lv-hsp');
    var hi = this._hi || 0, pw = this._pw || 900;
    if (hw && hpEl) {
      var hr = hw.getBoundingClientRect();
      var ph = hpEl.offsetHeight || 640;
      var hp = Math.min(1, Math.max(0, (20 - hr.top) / Math.max(1, hr.height - ph)));
      hi = Math.min(4, Math.floor(hp * 5));
      pw = hpEl.clientWidth || pw;
    }
    if (pct !== this._pct || act !== this._act || hi !== this._hi || pw !== this._pw) {
      this._pct = pct; this._act = act; this._hi = hi; this._pw = pw;
      this.setState({ pct: pct, act: act, hi: hi, pw: pw });
    }
  }
  renderVals() {
    var st = this.state || {};
    var act = typeof st.act === 'number' ? st.act : 0;
    var pct = typeof st.pct === 'number' ? st.pct : 0;
    var labels = ['Accueil', 'L’asso', 'Parcours', 'Méthode', 'Agenda', 'Soutenir'];
    var idx = labels.map(function (l, i) {
      var on = i === act;
      return { label: l, href: '#lv-s' + i, bg: on ? '#111111' : 'transparent', color: on ? '#FFFFFF' : '#111111' };
    });
    var hi = typeof st.hi === 'number' ? st.hi : 0;
    var pw = typeof st.pw === 'number' ? st.pw : 900;
    var iw = Math.round(pw * 0.58);
    var data = [
      ['2022', 'Création de l’association', 'Implantation aux Malassis et définition d’une mission reliant culture, patrimoine et citoyenneté.'],
      ['2023', 'Première Malédiction du Louvre', '114 enfants et 18 accompagnateurs : escape game, documentaire et échange autour du patrimoine.'],
      ['2023–2024', 'Le musée du Louvre à Bagnolet', 'Un espace pédagogique sur l’Égypte antique et Champollion : 3 663 visiteurs en huit mois.'],
      ['2025', 'Musée mobile et tournois inter-centres', 'Six centres de loisirs, cinq centres socioculturels, 547 jeunes, 95 à 98 % de satisfaction.'],
      ['2026', 'L’Empreinte Citoyenne', 'Formalisation de la méthode, premier parcours complet Notre Quartier Malassis, projet de Maison de la Citoyenneté.']
    ];
    var hItems = data.map(function (d, i) {
      var on = i === hi;
      var last = i === 4;
      return {
        year: d[0], title: d[1], text: d[2],
        pos: (i * 25) + '%',
        dot: on ? '#FF1F8A' : (i < hi ? '#111111' : '#D9D1C5'),
        lab: on ? '#FF1F8A' : (i < hi ? '#111111' : '#B9B0A3'),
        ys: on ? '104px' : '54px',
        yc: on ? (last ? '#C4005F' : '#111111') : '#CFC7BB',
        op: on ? 1 : 0.4
      };
    });
    return {
      clock: st.clock || this.clockStr(), pct: pct, idx: idx,
      hItems: hItems, hiw: iw + 'px', htx: (Math.round((pw - iw) / 2) - hi * iw) + 'px',
      hFill: (hi * 25) + '%', hNum: '0' + (hi + 1)
    };
  }
}

return Component;
}, {"$preview": {"width": 1440, "height": 900}});
</script>

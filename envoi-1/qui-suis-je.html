    (function (self) {
      var ID = 'qf';
      function el(n) { return document.getElementById(ID + '-' + n); }

      var P = [{ x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, cx: 478, cy: 40, id: 'dl', side: -1 }, { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, cx: 554, cy: 40, id: 'dr', side: 1 }];
      var raf = 0, holdT = 0, holding = false, inside = false;
      function loop() {
        var moving = false;
        P.forEach(function (p) {
          p.vx += (p.tx - p.x) * 0.12; p.vy += (p.ty - p.y) * 0.12; p.vx *= 0.8; p.vy *= 0.8; p.x += p.vx; p.y += p.vy;
          if (Math.abs(p.vx) + Math.abs(p.vy) + Math.abs(p.tx - p.x) + Math.abs(p.ty - p.y) > 0.05) { moving = true; }
          var g = el(p.id); if (g) { g.setAttribute('transform', 'translate(' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ')'); }
        });
        raf = moving ? requestAnimationFrame(loop) : 0;
      }
      function go() { if (!raf) { raf = requestAnimationFrame(loop); } }
      function aim(cx, cy, strong) {
        var s = el('lg'); if (!s) { return; }

        var pt = s.createSVGPoint(); pt.x = cx; pt.y = cy; var q = pt.matrixTransform(m.inverse());
        P.forEach(function (p) {
          var dx = q.x - p.cx, dy = q.y - p.cy, d = Math.hypot(dx, dy) || 1;
          var near = Math.max(0, 1 - d / (strong ? 320 : 220));
          p.tx = dx / d * Math.min(16, d * 0.06) + p.side * near * 30;
          p.ty = dy / d * Math.min(16, d * 0.06) - near * 6;
        });
        go();
      }
      function rest() { P.forEach(function (p) { p.tx = 0; p.ty = 0; }); go(); }
      function jump() { P.forEach(function (p, i) { setTimeout(function () { p.vy -= 16; p.vx += p.side * 3; go(); }, i * 90); }); }
      function over(t, pad) {
        var s = el('lg'); if (!s) { return false; }
        var r = s.getBoundingClientRect(); pad = pad || 0;
        return t.x >= r.left - pad && t.x <= r.right + pad && t.y >= r.top - pad && t.y <= r.bottom + pad;
      }
      function onMove(e) {

        var inNow = over({ x: e.clientX, y: e.clientY }, 120);
        if (inNow) { inside = true; aim(e.clientX, e.clientY, false); } else if (inside) { inside = false; rest(); }
      }
      function onClick(e) { var s = el('lg'); if (s && s.contains(e.target)) { jump(); } }
      function tStart(e) {

        var x = t.clientX, y = t.clientY;
        clearTimeout(holdT);
        holdT = setTimeout(function () { holding = true; jump(); aim(x, y, true); }, 220);
      }
      function tMove(e) {
        var t = e.touches[0]; if (!t) { return; }
        if (holding) { e.preventDefault(); aim(t.clientX, t.clientY, true); } else { clearTimeout(holdT); }
      }
      function tEnd() { clearTimeout(holdT); if (holding) { holding = false; rest(); } }
      function ctx(e) { var s = el('lg'); if (s && s.contains(e.target)) { e.preventDefault(); } }

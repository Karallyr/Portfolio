<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Maeva Benakli | Product designer</title>
<meta name="description" content="Portfolio de Maeva Benakli, product designer : études de cas UX/UI, sites web et identités visuelles.">
<meta property="og:title" content="Maeva Benakli | Product designer">

<meta property="og:description" content="Portfolio de Maeva Benakli, product designer : études de cas UX/UI, sites web et identités visuelles.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&amp;family=Geist+Mono:wght@400;500&amp;family=Geist:wght@300;400;500;600&amp;family=Noto+Serif:ital,wght@0,300;0,400;1,300;1,400&amp;display=swap">
<style>
body{margin:0; background-color: #FFFFFF; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&amp;family=Geist+Mono:wght@400;500&amp;family=Geist:wght@300;400;500;600&amp;family=Noto+Serif:ital,wght@0,300;0,400;1,300;1,400&amp;display=swap">
<style>
body{margin:0; background-color: #FFFFFF; }
*{box-sizing:border-box}
a{color:#3B5013}a:hover{color:#26340C}
.hero-bg{background:#3B5013 url(assets/accueil/78b3680eb2a8.jpg) center/cover no-repeat}
.hero-photo{background:#1A120A url(assets/accueil/d11f6f736368.webp) 50% 30%/cover no-repeat}
.tools-bg{background:#FDFBD4 url(assets/accueil/a4225762dbab.jpg) center/cover no-repeat}
.pr-bg{background:linear-gradient(rgba(30,42,8,.82),rgba(30,42,8,.82)),#26340C url(assets/accueil/78b3680eb2a8.jpg) center/cover no-repeat}
.nav-link{color:rgba(253,251,212,.75);text-decoration:none;transition:color .2s}
.nav-link:hover{color:#FFF6A2}
.soc{display:flex;align-items:center;justify-content:center;width:44px;height:44px;text-decoration:none;color:#FDFBD4}
.soc span{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:rgba(253,251,212,.14);transition:background .2s,color .2s}
.soc:hover span{background:#FFF6A2;color:#26340C}
.dot-pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(122,214,92,.55)}70%{box-shadow:0 0 0 9px rgba(122,214,92,0)}100%{box-shadow:0 0 0 0 rgba(122,214,92,0)}}
.folder{display:block;text-decoration:none;color:#26340C;transition:transform .3s}
.folder:hover{transform:translateY(-4px)}
.folder:focus-visible{outline:2px solid #FFF6A2;outline-offset:4px}
.sheet{position:absolute;bottom:58px;left:calc(50% - 52px);width:104px;height:128px;border-radius:10px;overflow:hidden;box-shadow:0 10px 24px -10px rgba(20,26,10,.45);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.s1{transform:translate(-44px,6px) rotate(-12deg)}
.s2{transform:translate(0,-6px) rotate(2deg)}
.s3{transform:translate(44px,8px) rotate(11deg)}
.folder:hover .s1,.folder:focus-visible .s1{transform:translate(-64px,-28px) rotate(-18deg)}
.folder:hover .s2,.folder:focus-visible .s2{transform:translate(0,-42px) rotate(-1deg)}
.folder:hover .s3,.folder:focus-visible .s3{transform:translate(64px,-24px) rotate(17deg)}
.tool-card{position:relative;border-radius:44px;background:rgba(253,251,212,.66);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.bridge{position:absolute;left:50%;bottom:-22px;width:150px;height:22px;margin-left:-75px;background:rgba(253,251,212,.66);-webkit-mask:radial-gradient(circle at 0 50%,transparent 10.5px,#000 11px) left/50% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 10.5px,#000 11px) right/50% 100% no-repeat;mask:radial-gradient(circle at 0 50%,transparent 10.5px,#000 11px) left/50% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 10.5px,#000 11px) right/50% 100% no-repeat}
.bridge-m{display:none}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.principle-note{transition:opacity .35s,transform .35s}
.btn{transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(38,52,12,.5)}
@property --pct{syntax:'<integer>';inherits:false;initial-value:0}
.intro{position:fixed;top:0;left:0;width:100%;height:100vh;max-height:1400px;z-index:9999;display:flex;align-items:center;justify-content:center;background:#3B5013 url(assets/accueil/78b3680eb2a8.jpg) center/cover no-repeat;color:#FDFBD4;transition:transform .9s cubic-bezier(.76,0,.24,1)}
.intro-out{transform:translateY(-100%)}
.intro-inner{display:flex;flex-direction:column;align-items:center;gap:28px;transition:opacity .45s,transform .6s cubic-bezier(.76,0,.24,1)}
.intro-out .intro-inner{opacity:0;transform:translateY(-60px)}
.intro-fill{animation:introFill 2.4s cubic-bezier(.65,0,.35,1) .2s both}
@keyframes introFill{from{transform:translateY(272px)}to{transform:translateY(-9px)}}
.intro-wave{animation:introWave 1.3s linear infinite}
@keyframes introWave{to{transform:translateX(-300px)}}
.intro-count{counter-reset:pct var(--pct);animation:introCount 2.4s cubic-bezier(.65,0,.35,1) .2s both}
.intro-count::before{content:counter(pct,decimal-leading-zero)}
@keyframes introCount{from{--pct:0}to{--pct:100}}
@media (prefers-reduced-motion:reduce){.intro-wave{animation:none}}
@media (max-width:960px){
.nav-role{display:none}
.pad-x{padding-left:24px !important;padding-right:24px !important}
.folder-wrap{position:relative !important;right:auto !important;bottom:auto !important;margin:0 24px 48px !important}
.hero-main{padding-right:24px !important;padding-top:320px !important}
.tools-grid{grid-template-columns:minmax(0,1fr) !important}
.bridge-m{display:block}
.principle-row{flex-direction:column !important;align-items:center !important;opacity:1 !important}
.principle-note{position:static !important;transform:none !important;opacity:1 !important;width:auto !important;max-width:420px;margin-top:6px}
}
@media (max-width:640px){
.hero-photo{background-position:72% 30% !important}
.soc-wrap{display:none !important}
.tool-card{border-radius:32px;padding:28px !important}
.tool-illu{display:none}
}
</style>
</head>
<body>
<div id="dc-app"></div>
<template id="dc-tpl-ProjetsV2"><div style="font-family: Geist, system-ui, sans-serif; color: #26340C; background-color: #ffffff">

<!-- ÉTUDES DE CAS -->
<section style="box-sizing: border-box; max-width: 1440px; margin: 0 auto; padding: 140px clamp(20px, 3.4vw, 48px) 40px; display: flex; flex-direction: column; gap: 88px">
<header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px 48px; flex-wrap: wrap; padding-bottom: 32px; border-bottom: 1px solid rgba(38,52,12,0.18)">
<div style="display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(38,52,12,0.72)">(01) Études de cas | Apps mobiles</span>
<h2 style="margin: 0; font-family: {{tf}}; font-weight: 300; font-size: clamp(40px, 5.4vw, 80px); line-height: 1.02; letter-spacing: -0.02em">Faire évoluer des apps<br>à partir des usages</h2>
</div>
<p style="margin: 0; max-width: 380px; font-size: 17px; line-height: 1.55; color: rgba(38,52,12,0.78)">Trois études de cas sur des applications existantes : recherche utilisateur, nouvelles fonctionnalités et pistes d’amélioration, testées puis affinées.</p>
</header>

<sc-for list="{{apps}}" as="p" hint-placeholder-count="3">
<article style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; gap: 16px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase"><span>{{p.meta}}</span><span>{{p.year}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="box-sizing: border-box; flex: 1.6 1 520px; min-width: 0; min-height: 600px; position: relative; overflow: hidden; border-radius: 6px; background: {{p.panel}}; display: flex; align-items: center; justify-content: flex-end; padding: 48px 12% 48px 24px">
<span style="position: absolute; top: 26px; left: 30px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.08em; color: {{p.big}}">N°{{p.n}}</span>
<sc-if value="{{p.isMock}}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; left: 24px; bottom: 6px; font-family: {{p.tf}}; font-weight: 300; font-size: clamp(76px, 9.4vw, 152px); line-height: 1; letter-spacing: -0.035em; color: {{p.big}}">{{p.name}}</span>
</sc-if>
<sc-if value="{{p.isAlan}}" hint-placeholder-val="{{ false }}">
<img src="assets/accueil/313322a6d076.webp" alt="Logo Alan" style="position: absolute; left: 32px; top: 68px; width: clamp(150px, 16vw, 230px); height: auto">
<img src="assets/accueil/7bdf8ad7a33d.webp" alt="" aria-hidden="true" style="position: absolute; left: 12px; bottom: 0; width: auto; height: clamp(260px, 26vw, 380px)">
</sc-if>
<sc-if value="{{p.isPenny}}" hint-placeholder-val="{{ false }}">
<img src="assets/accueil/c3024dc47134.webp" alt="Logo Pennylane" style="position: absolute; left: 32px; top: 70px; width: clamp(170px, 18vw, 260px); height: auto">
<img src="assets/accueil/dca264b933c4.webp" alt="" aria-hidden="true" style="position: absolute; left: 4px; bottom: 4px; width: clamp(250px, 26vw, 380px); height: auto">
</sc-if>
<sc-if value="{{p.isVc}}" hint-placeholder-val="{{ false }}">
<img src="assets/accueil/08fd99fbcb26.webp" alt="Logo Vestiaire Collective" style="position: absolute; left: 32px; top: 66px; width: clamp(150px, 15vw, 220px); height: auto">
<img src="assets/accueil/d03d77e00bfb.webp" alt="" aria-hidden="true" style="position: absolute; left: 24px; bottom: 24px; width: 218px; height: 228px; transform: rotate(-13deg)">
</sc-if>
<sc-if value="{{p.isAlan}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing: border-box; position: relative; z-index: 1; flex-shrink: 0; width: 250px; padding: 8px; border-radius: 42px; background: #14141F; transform: rotate(-6deg); box-shadow: 0 40px 70px -26px rgba(40,30,110,0.55)">
<img src="assets/accueil/2ec936d27af6.webp" alt="Accueil de l’app Alan avec la carte Défi solidaire contre l’AVC" style="display: block; width: 100%; height: auto; border-radius: 34px">
</div>
</sc-if>
<sc-if value="{{p.isPenny}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing: border-box; position: relative; z-index: 1; flex-shrink: 0; width: 250px; padding: 8px; border-radius: 42px; background: #0E1B19; transform: rotate(-6deg); box-shadow: 0 40px 70px -26px rgba(0,70,64,0.55)">
<img src="assets/accueil/8f60e023accb.webp" alt="Accueil de l’app Pennylane : total des dépenses, part validée, date du prochain virement et montants en attente" style="display: block; width: 100%; height: auto; border-radius: 34px">
</div>
</sc-if>
<sc-if value="{{p.isVc}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing: border-box; position: relative; z-index: 1; flex-shrink: 0; width: 250px; padding: 8px; border-radius: 42px; background: #111111; transform: rotate(-6deg); box-shadow: 0 40px 70px -26px rgba(120,40,10,0.5)">
<img src="assets/accueil/d4d99d13b59d.webp" alt="Mon vestiaire, onglet Mes ventes : relance des acheteurs, annonces, ventes en cours et statistiques" style="display: block; width: 100%; height: auto; border-radius: 34px">
</div>
</sc-if>
<sc-if value="{{p.isMock}}" hint-placeholder-val="{{ true }}">
<div style="box-sizing: border-box; position: relative; z-index: 1; flex-shrink: 0; width: 250px; height: 512px; padding: 9px; border-radius: 42px; background: #141A0A; transform: rotate(-6deg); box-shadow: 0 40px 70px -26px rgba(10,14,4,0.7)">
<div style="box-sizing: border-box; position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 34px; background: {{p.screen}}; color: {{p.ink}}; display: flex; flex-direction: column; gap: 14px; padding: 46px 18px 16px">
<div style="position: absolute; top: 11px; left: 50%; width: 76px; height: 22px; margin-left: -38px; border-radius: 12px; background: #141A0A"></div>
<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase"><span style="opacity: 0.75">{{p.appName}}</span><span style="width: 22px; height: 22px; border-radius: 50%; background: {{p.card}}"></span></div>
<div style="font-family: {{p.tf}}; font-weight: 300; font-size: 25px; line-height: 1.08; letter-spacing: -0.01em">{{p.greeting}}</div>
<div style="box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; min-height: 126px; padding: 14px; border-radius: 18px; background: {{p.card}}; color: {{p.cardInk}}">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.1em; opacity: 0.85">{{p.cardLabel}}</span>
<span style="font-size: 17px; font-weight: 500; line-height: 1.2">{{p.cardValue}}</span>
</div>
<sc-for list="{{p.rows}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; background: {{r.bg}}; font-size: 11px; line-height: 1.3"><span style="flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span><span>{{r.t}}</span></div>
</sc-for>
<div style="margin-top: auto; display: flex; justify-content: space-around; align-items: center; padding: 9px; border-radius: 999px; background: {{p.tabBg}}">
<span style="width: 26px; height: 26px; border-radius: 50%; background: {{p.card}}"></span>
<span style="width: 18px; height: 4px; border-radius: 2px; background: {{p.ink}}; opacity: 0.3"></span>
<span style="width: 18px; height: 4px; border-radius: 2px; background: {{p.ink}}; opacity: 0.3"></span>
<span style="width: 18px; height: 4px; border-radius: 2px; background: {{p.ink}}; opacity: 0.3"></span>
</div>
</div>
</div>
</sc-if>
</div>
<div style="box-sizing: border-box; flex: 1 1 340px; min-width: 0; min-height: 600px; position: relative; border-radius: 6px; background: {{p.panel2}}; display: flex; align-items: center; justify-content: center; padding: 64px 28px">
<sc-if value="{{p.isAlan}}" hint-placeholder-val="{{ false }}">
<img src="assets/accueil/cae2396afeee.webp" alt="Ajout d’un bilan tension et cholestérol à la checklist santé" style="display: block; width: 100%; max-width: 290px; height: auto; border-radius: 24px; transform: rotate(2deg); box-shadow: 0 30px 60px -30px rgba(40,30,110,0.45)">
</sc-if>
<sc-if value="{{p.isPenny}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing: border-box; width: 100%; max-width: 330px; padding: 18px; border-radius: 24px; background: #FFFFFF; transform: rotate(2deg); box-shadow: 0 30px 60px -30px rgba(0,70,64,0.45)">
<img src="assets/accueil/9ff8b49204e8.webp" alt="Montant d’une nuit d’hôtel avec la jauge orange : limite dépassée, remboursement de 150 € et lien vers le règlement" style="display: block; width: 100%; height: auto">
</div>
</sc-if>
<sc-if value="{{p.isVc}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing: border-box; width: 100%; max-width: 340px; padding: 14px; border-radius: 24px; background: #FFFFFF; transform: rotate(2deg); box-shadow: 0 30px 60px -30px rgba(120,40,10,0.45)">
<img src="assets/accueil/911e5099b74b.webp" alt="Carte d’annonce avec jours en ligne, vues et favoris, et le conseil : 28 favoris, aucune offre, voir les leviers" style="display: block; width: 100%; height: auto">
</div>
</sc-if>
<sc-if value="{{p.isMock}}" hint-placeholder-val="{{ true }}">
<div style="box-sizing: border-box; width: 100%; max-width: 290px; display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 22px; background: {{p.detailBg}}; color: {{p.detailInk}}; transform: rotate(2deg); box-shadow: 0 30px 60px -30px rgba(10,14,4,0.6)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em">{{p.detailLabel}}</span>
<span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: {{p.fill}}"></span>
</div>
<span style="font-family: {{p.tf}}; font-weight: 300; font-size: 30px; line-height: 1.05; letter-spacing: -0.01em">{{p.detailValue}}</span>
<span style="font-size: 13px; line-height: 1.4; opacity: 0.8">{{p.detailNote}}</span>
<div style="height: 8px; border-radius: 4px; background: {{p.track}}; overflow: hidden"><div style="height: 100%; width: {{p.progress}}; border-radius: 4px; background: {{p.fill}}"></div></div>
</div>
</sc-if>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px 32px; flex-wrap: wrap; margin-top: 6px">
<p style="margin: 0; max-width: 560px; font-size: 17px; line-height: 1.5"><strong style="font-weight: 500">{{p.title}}.</strong> <span style="color: rgba(38,52,12,0.78)">{{p.desc}}</span></p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{p.tagList}}" as="t" hint-placeholder-count="3">
<span style="padding: 6px 11px; border-radius: 999px; background: #FFF6A2; border: 1px solid rgba(59,80,19,0.2); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; border-style: none; color: #A19103">{{t.t}}</span>
</sc-for>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(38,52,12,0.18)">
<a href="{{p.href}}" style="padding: 16px 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; color: #26340C">LIRE L’ÉTUDE DE CAS</a>
<span aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #26340C"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #26340C"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #26340C"></span></span>
</div>
</article>
</sc-for>
</section>

<!-- SITES WEB -->
<section style="box-sizing: border-box; max-width: 1440px; margin: 0 auto; padding: 100px clamp(20px, 3.4vw, 48px) 140px; display: flex; flex-direction: column; gap: 88px">
<header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px 48px; flex-wrap: wrap; padding-bottom: 32px; border-bottom: 1px solid rgba(38,52,12,0.18)">
<div style="display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(38,52,12,0.72)">(02) Sites web | Freelance</span>
<h2 style="margin: 0; font-family: {{tf}}; font-weight: 300; font-size: clamp(40px, 5.4vw, 80px); line-height: 1.02; letter-spacing: -0.02em">Des sites qui clarifient<br>une offre et une identité</h2>
</div>
<p style="margin: 0; max-width: 380px; font-size: 17px; line-height: 1.55; color: rgba(38,52,12,0.78)">Identité visuelle, webdesign et animations : deux sites vitrines conçus en freelance, pour une entreprise de services et une association culturelle.</p>
</header>

<sc-for list="{{sites}}" as="w" hint-placeholder-count="2">
<article style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; gap: 16px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase"><span>{{w.meta}}</span><span>{{w.year}}</span></div>
<div style="position: relative; overflow: hidden; box-sizing: border-box; min-height: 540px; border-radius: 6px; background: {{w.frame}}; display: flex; align-items: center; justify-content: center; padding: clamp(24px, 6vw, 96px)">
<sc-if value="{{w.isCna}}" hint-placeholder-val="{{ false }}">
<img src="assets/accueil/81f15f061521.webp" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.12)">
<span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 45%, rgba(4,30,46,0.28) 100%)"></span>
</sc-if>
<sc-if value="{{w.isLouvre}}" hint-placeholder-val="{{ false }}">
<img src="assets/accueil/36c545a16c62.webp" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.12)">
<span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 45%, rgba(60,0,30,0.22) 100%)"></span>
</sc-if>
<div style="position: relative; z-index: 1; width: 100%; max-width: 900px; container-type: inline-size; border-radius: 6px; overflow: hidden; background: {{w.siteBg}}; color: {{w.siteInk}}; box-shadow: 0 50px 90px -36px rgba(4,20,30,0.65)">
<sc-if value="{{w.isCna}}" hint-placeholder-val="{{ false }}">
<img src="assets/accueil/48e39e9cedcd.webp" alt="Page d’accueil du site Allen Maintenance | Controlnet" style="display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: 50% 0">
</sc-if>
<sc-if value="{{w.isLouvre}}" hint-placeholder-val="{{ false }}">
<img src="assets/accueil/ceaafbbb0d78.webp" alt="Page d’accueil du site Chill au Louvre" style="display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: 50% 0">
</sc-if>
